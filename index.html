<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recetario | Vicky Café</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-mark">
                VC
            </div>

            <div>

                <strong>
                    Vicky Café
                </strong>

                <span>
                    Recetario interno
                </span>

            </div>

        </div>


        <nav>

            <button
                class="nav-btn active"
                data-view="dashboard"
            >
                🏠
                <span>
                    Inicio
                </span>
            </button>


            <button
                class="nav-btn"
                data-view="recipes"
            >
                🍽️
                <span>
                    Platos
                </span>
            </button>


            <button
                class="nav-btn"
                data-view="subrecipes"
            >
                👨‍🍳
                <span>
                    Sub recetas
                </span>
            </button>


            <button
                class="nav-btn"
                data-view="ingredients"
            >
                🥕
                <span>
                    Insumos
                </span>
            </button>


            <button
                class="nav-btn"
                data-view="tasks"
            >
                ✅
                <span>
                    Tareas
                </span>
            </button>

        </nav>


        <div class="sidebar-note">

            <b>
                Sistema interno
            </b>

            <br>

            Las cantidades de peso se
            muestran en gramos para
            facilitar el trabajo en cocina.

        </div>

    </aside>



    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <header class="topbar">

            <div>

                <p class="eyebrow">
                    RECETARIO DIGITAL
                </p>

                <h1 id="page-title">
                    Panel general
                </h1>

            </div>


            <div class="top-actions">

                <label class="search">

                    <span>
                        🔎
                    </span>

                    <input
                        id="search"
                        type="search"
                        placeholder="Buscar plato, receta o insumo..."
                    >

                </label>

            </div>

        </header>


        <!-- =================================================
             CONTENIDO DINÁMICO
        ================================================== -->

        <section id="app"></section>


    </main>



    <!-- =================================================
         MODAL
    ================================================== -->

    <div
        id="modal"
        class="modal hidden"
    >

        <div
            class="modal-backdrop"
            data-close
        ></div>


        <article class="modal-card">

            <button
                class="close"
                data-close
                aria-label="Cerrar"
            >
                ×
            </button>


            <div id="modal-content"></div>

        </article>

    </div>



    <!-- =================================================
         DATOS
    ================================================== -->

    <script src="data.js"></script>


    <!-- =================================================
         APLICACIÓN
    ================================================== -->

    <script src="app.js"></script>


</body>

</html>
